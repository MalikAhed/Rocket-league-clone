name: Prepare GitHub Pages snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-snapshot
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository
        run: npm test

      - name: Expand packed game assets
        run: node unpack.mjs

      - name: Prepare static files
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile, access } from 'node:fs/promises';
          import { gunzipSync } from 'node:zlib';
          import path from 'node:path';

          const root = path.resolve('web');

          async function exists(file) {
            try { await access(file); return true; } catch { return false; }
          }

          async function walk(dir) {
            const entries = await readdir(dir, { withFileTypes: true });
            for (const entry of entries) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                await walk(file);
                continue;
              }

              // The local Node server exposes *.gz resources at the original
              // uncompressed URL. Materialize those URLs for static hosting.
              if (file.endsWith('.gz')) {
                const target = file.slice(0, -3);
                if (!(await exists(target))) {
                  await writeFile(target, gunzipSync(await readFile(file)));
                }
              }

              // The local server also maps requests such as texture.png to
              // texture.png.webp. Duplicate those optimized bytes at the URL
              // the browser already requests.
              if (file.endsWith('.webp')) {
                const target = file.slice(0, -5);
                if (!(await exists(target))) {
                  await writeFile(target, await readFile(file));
                }
              }
            }
          }

          await walk(root);
          console.log('Prepared static game files in web/.');
          NODE

      - name: Publish static snapshot into main/docs
        run: |
          rm -rf docs
          mkdir docs
          cp -a web/. docs/
          touch docs/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs

          if git diff --cached --quiet; then
            echo "Static snapshot is already current."
            exit 0
          fi

          git commit -m "ci: publish static Pages snapshot"
          git push origin HEAD:main
